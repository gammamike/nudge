name: Linux checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust ${{ matrix.rust }} / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, '1.88.0']
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Rust toolchain
        run: |
          rustup toolchain install '${{ matrix.rust }}' --profile minimal --component rustfmt --component clippy
          rustup override set '${{ matrix.rust }}'
      - name: Check formatting and Bash syntax
        run: |
          cargo fmt --check
          for script in nudge.bash interactive.bash try-bash install.sh scripts/*.sh tests/distribution-smoke.sh; do bash -n "$script"; done
      - name: Lint and test Rust
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build and test shell and provider integrations
        run: |
          cargo build --locked --release
          python3 -m unittest discover -s tests -v
