[package]
name = "nudge-rust"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Fast, local-first command correction for Bash on Linux"
license = "GPL-3.0-only"
repository = "https://github.com/gammamike/nudge"
readme = "README.md"

[dependencies]
anyhow = "1.0"
regex = "1.13"
rustix = { version = "1.1", features = ["event", "process", "termios"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
